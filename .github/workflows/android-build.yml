name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main, codex/development-audit]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test MikroTik API
        run: |
          mkdir -p /tmp/sm-tests
          javac -d /tmp/sm-tests app/src/main/java/com/smartmanager/nativeapp/RouterApi.java app/src/main/java/com/smartmanager/nativeapp/RouterService.java app/src/main/java/com/smartmanager/nativeapp/VoucherService.java app/src/main/java/com/smartmanager/nativeapp/UserManagerService.java app/src/main/java/com/smartmanager/nativeapp/BatchLedger.java app/src/main/java/com/smartmanager/nativeapp/BatchReconciler.java app/src/main/java/com/smartmanager/nativeapp/RouterIdentity.java app/src/main/java/com/smartmanager/nativeapp/BatchArchive.java app/src/main/java/com/smartmanager/nativeapp/MutationGuard.java app/src/main/java/com/smartmanager/nativeapp/PdfLayout.java tests/ApiProtocolTest.java tests/ApiMockServerTest.java tests/RouterAddDisconnectMockTest.java tests/VoucherServiceTest.java tests/UserManagerServiceTest.java tests/CommandValidationTest.java tests/StateToggleTest.java tests/BatchLedgerTest.java tests/BatchReconciliationMockTest.java tests/BatchArchiveTest.java tests/MutationGuardTest.java tests/PdfLayoutTest.java
          java -cp /tmp/sm-tests ApiProtocolTest
          java -cp /tmp/sm-tests ApiMockServerTest
          java -cp /tmp/sm-tests RouterAddDisconnectMockTest
          java -cp /tmp/sm-tests VoucherServiceTest
          java -cp /tmp/sm-tests UserManagerServiceTest
          java -cp /tmp/sm-tests CommandValidationTest
          java -cp /tmp/sm-tests StateToggleTest
          java -cp /tmp/sm-tests BatchLedgerTest
          java -cp /tmp/sm-tests BatchReconciliationMockTest
          java -cp /tmp/sm-tests BatchArchiveTest
          java -cp /tmp/sm-tests MutationGuardTest
          java -cp /tmp/sm-tests PdfLayoutTest

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SmartManager-Android-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ui-smoke:
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK and build APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'system-images;android-34;google_apis;x86_64'
          yes | sdkmanager --licenses >/dev/null || true
          gradle --no-daemon assembleDebug
      - name: Start controlled emulator and run UI smoke
        env:
          ANDROID_AVD_HOME: /tmp/android-avd
        run: |
          set -o pipefail
          mkdir -p /tmp/ui-diagnostics
          date +%s > /tmp/ui-diagnostics/start
          test -e /dev/kvm || { echo 'KVM unavailable'; cat /proc/cpuinfo > /tmp/ui-diagnostics/cpuinfo; exit 70; }
          echo 'KVM available' | tee /tmp/ui-diagnostics/kvm
          echo no | avdmanager create avd -n sm-api34 -k 'system-images;android-34;google_apis;x86_64' --force --device 'pixel_2'
          emulator -avd sm-api34 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > /tmp/ui-diagnostics/emulator.log 2>&1 &
          EMU=$!; trap 'kill $EMU 2>/dev/null || true; adb kill-server || true' EXIT
          adb start-server > /tmp/ui-diagnostics/adb-start.log 2>&1
          for i in $(seq 1 60); do adb get-state 2>/dev/null | grep -q device && break; sleep 2; done
          adb get-state | grep -q device || { adb devices -l > /tmp/ui-diagnostics/devices; exit 71; }
          for i in $(seq 1 60); do boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$boot" = 1 ] && break; sleep 2; done
          [ "$boot" = 1 ] || { adb shell getprop > /tmp/ui-diagnostics/getprop; exit 72; }
          adb shell settings put system screen_off_timeout 2147483647 || true
          adb install -r app/build/outputs/apk/debug/app-debug.apk > /tmp/ui-diagnostics/install.log
          adb shell am start -W -n com.smartmanager.nativeapp/.MainActivity > /tmp/ui-diagnostics/launch.log
          sleep 2
          focus=$(adb shell dumpsys window windows | tr -d '\r' | grep -E 'mCurrentFocus|mFocusedApp' | head -1); echo "$focus" | tee /tmp/ui-diagnostics/focus-dashboard
          echo "$focus" | grep -q com.smartmanager.nativeapp
          adb shell uiautomator dump /sdcard/dashboard.xml >/dev/null; adb pull /sdcard/dashboard.xml /tmp/ui-diagnostics/dashboard.xml >/dev/null
          grep -q 'Smart Manager' /tmp/ui-diagnostics/dashboard.xml
          adb exec-out screencap -p > /tmp/dashboard.png
          adb shell input keyevent 4 || true
          adb shell am start -W -n com.smartmanager.nativeapp/.MainActivity >/dev/null
          adb shell uiautomator dump /sdcard/main.xml >/dev/null; adb pull /sdcard/main.xml /tmp/ui-diagnostics/main.xml >/dev/null
          grep -q 'Hotspot' /tmp/ui-diagnostics/main.xml
          adb shell input tap 300 500
          sleep 1
          adb shell uiautomator dump /sdcard/hotspot.xml >/dev/null; adb pull /sdcard/hotspot.xml /tmp/ui-diagnostics/hotspot.xml >/dev/null
          grep -q 'Hotspot' /tmp/ui-diagnostics/hotspot.xml
          adb exec-out screencap -p > /tmp/hotspot.png
          adb shell dumpsys activity activities > /tmp/ui-diagnostics/activities
          ! grep -E 'ANR|not responding' /tmp/ui-diagnostics/activities
          ! adb logcat -d -t 500 | grep -E 'FATAL EXCEPTION|ANR in'
          sha256sum /tmp/dashboard.png /tmp/hotspot.png | tee /tmp/ui-diagnostics/screenshots.sha256
      - name: Upload emulator diagnostics and verified screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartManager-Android-ui-diagnostics
          path: |
            /tmp/ui-diagnostics
            /tmp/dashboard.png
            /tmp/hotspot.png
          if-no-files-found: warn
