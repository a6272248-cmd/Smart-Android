name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test MikroTik API
        run: |
          mkdir -p /tmp/sm-tests
          javac -d /tmp/sm-tests app/src/main/java/com/smartmanager/nativeapp/RouterApi.java app/src/main/java/com/smartmanager/nativeapp/RouterService.java app/src/main/java/com/smartmanager/nativeapp/VoucherService.java app/src/main/java/com/smartmanager/nativeapp/UserManagerService.java tests/ApiProtocolTest.java tests/ApiMockServerTest.java tests/VoucherServiceTest.java tests/UserManagerServiceTest.java tests/CommandValidationTest.java tests/StateToggleTest.java
          java -cp /tmp/sm-tests ApiProtocolTest
          java -cp /tmp/sm-tests ApiMockServerTest
          java -cp /tmp/sm-tests VoucherServiceTest
          java -cp /tmp/sm-tests UserManagerServiceTest
          java -cp /tmp/sm-tests CommandValidationTest
          java -cp /tmp/sm-tests StateToggleTest

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SmartManager-Android-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
