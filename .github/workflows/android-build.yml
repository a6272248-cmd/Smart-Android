name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main, codex/development-audit]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test MikroTik API
        run: |
          mkdir -p /tmp/sm-tests
          javac -d /tmp/sm-tests app/src/main/java/com/smartmanager/nativeapp/RouterApi.java app/src/main/java/com/smartmanager/nativeapp/RouterService.java app/src/main/java/com/smartmanager/nativeapp/VoucherService.java app/src/main/java/com/smartmanager/nativeapp/UserManagerService.java app/src/main/java/com/smartmanager/nativeapp/BatchLedger.java app/src/main/java/com/smartmanager/nativeapp/BatchReconciler.java app/src/main/java/com/smartmanager/nativeapp/RouterIdentity.java app/src/main/java/com/smartmanager/nativeapp/BatchArchive.java app/src/main/java/com/smartmanager/nativeapp/MutationGuard.java app/src/main/java/com/smartmanager/nativeapp/PdfLayout.java tests/ApiProtocolTest.java tests/ApiMockServerTest.java tests/RouterAddDisconnectMockTest.java tests/VoucherServiceTest.java tests/UserManagerServiceTest.java tests/CommandValidationTest.java tests/StateToggleTest.java tests/BatchLedgerTest.java tests/BatchReconciliationMockTest.java tests/BatchArchiveTest.java tests/MutationGuardTest.java tests/PdfLayoutTest.java
          java -cp /tmp/sm-tests ApiProtocolTest
          java -cp /tmp/sm-tests ApiMockServerTest
          java -cp /tmp/sm-tests RouterAddDisconnectMockTest
          java -cp /tmp/sm-tests VoucherServiceTest
          java -cp /tmp/sm-tests UserManagerServiceTest
          java -cp /tmp/sm-tests CommandValidationTest
          java -cp /tmp/sm-tests StateToggleTest
          java -cp /tmp/sm-tests BatchLedgerTest
          java -cp /tmp/sm-tests BatchReconciliationMockTest
          java -cp /tmp/sm-tests BatchArchiveTest
          java -cp /tmp/sm-tests MutationGuardTest
          java -cp /tmp/sm-tests PdfLayoutTest

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SmartManager-Android-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ui-smoke:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run native UI smoke flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.smartmanager.nativeapp
            adb shell monkey -p com.smartmanager.nativeapp 1
            sleep 5
            adb exec-out screencap -p > /tmp/dashboard.png
            adb shell input tap 220 420
            sleep 1
            adb exec-out screencap -p > /tmp/routers.png
            adb shell input keyevent 4
            adb shell input tap 220 520
            sleep 1
            adb exec-out screencap -p > /tmp/hotspot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SmartManager-Android-ui-screenshots
          path: /tmp/*.png
          if-no-files-found: warn
